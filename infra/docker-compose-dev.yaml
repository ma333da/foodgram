services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
  backend:
    build: ../backend
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 foodgram.wsgi
    volumes:
      - static_value:/backend_static
      - media_value:/app/media/
    depends_on:
      - db
    env_file:
      - .env
  frontend:
    build: ../frontend
    command: sh -c "npm run build && cp -r build/* /frontend_build/"
    volumes:
      - frontend_build:/frontend_build
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/usr/share/nginx/html/
      - static_value:/usr/share/nginx/html/static/
      - media_value:/usr/share/nginx/html/media/
      - ../docs/:/usr/share/nginx/html/api/docs/
    depends_on:
      - backend
volumes:
  db_data:
  static_value:
  media_value:
  frontend_build: