server {
  listen 80;
  index index.html;
  server_tokens off;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/;
  }

  location /media/ {
    alias /app/media/;
    client_max_body_size 20M;
  }
 
  location / {
    root /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ index.html;
  }
  
}