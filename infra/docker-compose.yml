version: '3.3'
services:

  db:
    image: postgres:13.0-alpine
    ports:
      - "5432:5432"
    volumes: 
      - db_data:/var/lib/postgresql/data/
    env_file: 
      - ./.env
 
  backend:
    image: ma333da/foodgram_backend:latest
    restart: always
    volumes:
      - ./data/:/app/data/
      - static_value:/backend_static
      - media_value:/app/media/
    depends_on:
      - db
    env_file:
      - ./.env 

  frontend:
    image: ma333da/foodgram_frontend:latest
    volumes:
      - frontend:/app/result_build/build/
 
  nginx:
    image: nginx:1.19.3
    ports:
      - 8000:80
    volumes:
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_value:/usr/share/nginx/html/
      - media_value:/var/html/media/
      - frontend:/usr/share/nginx/html/
    restart: always
    depends_on:
      - backend

 
volumes:
  static_value:
  media_value:
  db_data:
  frontend:
